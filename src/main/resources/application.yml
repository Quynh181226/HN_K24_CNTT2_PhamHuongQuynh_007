server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: cloud
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        distance-type: COSINE_DISTANCE
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}
        dimensions: ${EMBEDDING_DIMENSIONS:1536}

langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  host: ${LANGFUSE_HOST:http://localhost:3000}

mcp:
  antigravity:
    enabled: ${MCP_ANTIGRAVITY_ENABLED:false}
    endpoint: ${MCP_ANTIGRAVITY_ENDPOINT:}
    token: ${MCP_ANTIGRAVITY_TOKEN:}
